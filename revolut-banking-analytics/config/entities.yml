entities:
  BRANCHES:
    target_table: BRANCHES_bronze
    primary_key: BranchID
    columns: [BranchID, BranchName, City, Country, SortCodePrefix, Region]
    required_fields: [BranchID, BranchName, SortCodePrefix]
    data_types: {BranchID: INT64, BranchName: STRING, City: STRING, Country: STRING, SortCodePrefix: STRING, Region: STRING}
  CUSTOMERS:
    target_table: CUSTOMERS_bronze
    primary_key: CustomerID
    columns: [CustomerID, FirstName, LastName, Email, Phone, DateOfBirth, City, Country, RiskRating, UpdatedAt]
    required_fields: [CustomerID, FirstName, LastName, Email, Phone, UpdatedAt]
    data_types: {CustomerID: INT64, FirstName: STRING, LastName: STRING, Email: STRING, Phone: STRING, DateOfBirth: DATE, City: STRING, Country: STRING, RiskRating: STRING, UpdatedAt: TIMESTAMP}
  EMPLOYEES:
    target_table: EMPLOYEES_bronze
    primary_key: EmployeeID
    columns: [EmployeeID, BranchID, FirstName, LastName, Role, HireDate, Status]
    required_fields: [EmployeeID, BranchID, FirstName, LastName, Status]
    data_types: {EmployeeID: INT64, BranchID: INT64, FirstName: STRING, LastName: STRING, Role: STRING, HireDate: DATE, Status: STRING}
  ACCOUNTTYPES:
    target_table: ACCOUNTTYPES_bronze
    primary_key: AccountTypeID
    columns: [AccountTypeID, AccountType, ProductCategory, MonthlyFee, InterestRate, OverdraftLimit]
    required_fields: [AccountTypeID, AccountType, ProductCategory, OverdraftLimit]
    data_types: {AccountTypeID: INT64, AccountType: STRING, ProductCategory: STRING, MonthlyFee: NUMERIC, InterestRate: NUMERIC, OverdraftLimit: NUMERIC}
  ACCOUNTS:
    target_table: ACCOUNTS_bronze
    primary_key: AccountID
