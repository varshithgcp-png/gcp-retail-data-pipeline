    required_fields: [AccountID, CustomerID, AccountTypeID, BranchID, SortCode, AccountNumber, Currency, Balance, OpenDate, Status, UpdatedAt]
    data_types: {AccountID: INT64, CustomerID: INT64, AccountTypeID: INT64, BranchID: INT64, SortCode: STRING, AccountNumber: STRING, Currency: STRING, Balance: NUMERIC, OpenDate: DATE, CloseDate: DATE, Status: STRING, UpdatedAt: TIMESTAMP}
  CARDS:
    target_table: CARDS_bronze
    primary_key: CardID
    columns: [CardID, AccountID, CardType, Network, IssueDate, ExpiryDate, Status, ContactlessEnabled]
    required_fields: [CardID, AccountID, CardType, Status]
