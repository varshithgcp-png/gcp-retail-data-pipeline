name: Deploy GCP Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Resolve Composer environment bucket
        id: composer
        run: |
          DAG_PREFIX="$(gcloud composer environments describe             "${{ vars.COMPOSER_ENVIRONMENT }}"             --location="${{ vars.COMPOSER_LOCATION }}"             --format='value(config.dagGcsPrefix)')"
          ENV_BUCKET="$(echo "$DAG_PREFIX" | sed -E 's#gs://([^/]+)/dags#\1#')"
          echo "dag_prefix=$DAG_PREFIX" >> "$GITHUB_OUTPUT"
          echo "env_bucket=$ENV_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Package Dataproc Python modules
        run: |
          zip -r spark_jobs.zip spark_jobs

      - name: Upload Dataproc artifacts
        run: |
          gcloud storage cp spark_jobs/run_transformations.py             "gs://${{ vars.ARTIFACT_BUCKET }}/code/spark_jobs/run_transformations.py"
          gcloud storage cp spark_jobs.zip             "gs://${{ vars.ARTIFACT_BUCKET }}/code/spark_jobs/spark_jobs.zip"

      - name: Sync supporting code to Composer data folder
        run: |
          DEST="gs://${{ steps.composer.outputs.env_bucket }}/data/gcp-retail-data-pipeline"

          gcloud storage rsync --recursive dataflow "$DEST/dataflow"
          gcloud storage rsync --recursive dbt "$DEST/dbt"
          gcloud storage rsync --recursive config "$DEST/config"
          gcloud storage rsync --recursive streaming "$DEST/streaming"
          gcloud storage cp setup.py "$DEST/setup.py"
          gcloud storage cp requirements.txt "$DEST/requirements.txt"

      - name: Deploy Composer DAG
        run: |
          gcloud composer environments storage dags import             --environment="${{ vars.COMPOSER_ENVIRONMENT }}"             --location="${{ vars.COMPOSER_LOCATION }}"             --source="airflow/fitanalytics_batch_dag.py"

      - name: Deployment summary
        run: |
          echo "Composer bucket: gs://${{ steps.composer.outputs.env_bucket }}"
          echo "Supporting code synced to /data/gcp-retail-data-pipeline"
          echo "Dataproc artifacts uploaded to gs://${{ vars.ARTIFACT_BUCKET }}/code/spark_jobs/"
          echo "Composer DAG import requested."
