name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest google-cloud-pubsub
          python -m pip install "apache-beam[gcp]>=2.60.0,<3.0.0"
          python -m pip install -e .

      - name: Python syntax validation
        run: |
          python -m compileall dataflow streaming spark_jobs

      - name: Batch validation unit tests
        run: |
          python -m pytest -q tests/test_validators.py

      - name: Streaming validation unit tests
        run: |
          python -m pytest -q tests/test_streaming_validation.py

      - name: Install dbt BigQuery
        run: |
          python -m pip install "dbt-bigquery>=1.12.3,<1.13.0"

      - name: Resolve dbt packages
        working-directory: dbt
        run: |
          dbt deps
