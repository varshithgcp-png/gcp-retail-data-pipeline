version: 2

sources:
  - name: curated
    description: "Curated Fit Analytics warehouse tables produced by Phase 3."
    database: "{{ env_var('DBT_BIGQUERY_PROJECT') }}"
    schema: fitanalytics_curated
    tables:
      - name: dim_customer
        description: "SCD Type 2 customer fit-profile dimension."
        columns:
          - name: customer_sk
            tests: [not_null, unique]
          - name: customer_id
            tests: [not_null]
          - name: is_current
            tests:
              - accepted_values:
                  arguments:
                    values: [true, false]
                    quote: false

      - name: dim_product
        description: "SCD Type 2 product and sizing dimension."
        columns:
          - name: product_sk
            tests: [not_null, unique]
          - name: product_id
            tests: [not_null]
          - name: fit_profile
            tests:
              - accepted_values:
                  arguments:
                    values: ["TRUE_TO_SIZE", "RUNS_SMALL", "RUNS_LARGE"]

      - name: fact_purchase
        description: "Purchase facts with customer/product surrogate keys."
        columns:
          - name: purchase_id
            tests: [not_null, unique]
          - name: customer_id
            tests: [not_null]
          - name: product_id
            tests: [not_null]

      - name: fact_return
        description: "Return facts including fit feedback."
        columns:
          - name: return_id
            tests: [not_null, unique]
          - name: return_reason
            tests: [not_null]
          - name: fit_feedback
            tests:
              - accepted_values:
                  arguments:
                    values: ["TRUE_TO_SIZE", "RUNS_SMALL", "RUNS_LARGE"]
                  config:
                    where: "fit_feedback is not null"

      - name: fact_recommendation
        description: "Curated batch recommendation facts."
        columns:
          - name: recommendation_id
            tests: [not_null, unique]
          - name: event_id
            tests: [not_null, unique]

  - name: streaming
    description: "Deduplicated real-time recommendation events from Dataflow."
    database: "{{ env_var('DBT_BIGQUERY_PROJECT') }}"
    schema: fitanalytics_streaming
    tables:
      - name: vw_recommendation_events_deduped
        description: "One latest streaming row per event_id."
        columns:
          - name: event_id
            tests: [not_null, unique]
          - name: recommendation_id
            tests: [not_null]
          - name: customer_id
            tests: [not_null]
          - name: product_id
            tests: [not_null]
